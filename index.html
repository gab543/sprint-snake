<!doctype html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <title>Snake 2099</title>
    <link rel="stylesheet" href="dist/main.css">
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400..900&display=swap" rel="stylesheet">
    <!-- Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css">
    <!-- Scripts -->
    <script type="module" src="src/js/utilities/darkMode.js" defer></script>
    <script type="module" src="src/js/main.js" defer></script>
</head>

<body>

    <!-- HEADER -->
    <header class="top-bar">
        <nav class="top-nav">
            <div class="logo">
                <span class="accent">SNAKE</span> 2099
            </div>
            <div id="darkModeBtn" class="toggle">
                <i class="fa-regular fa-moon moon-icon"></i>
                <i class="fa-regular fa-sun sun-icon"></i>
                <div class="toggle-ball"></div>
            </div>
        </nav>
    </header>

    <!-- MAIN LAYOUT -->
    <main class="hud-layout">
        <!-- OVERLAY -->
        <div id="modalOverlay" class="modal-overlay hidden"></div>
        <!-- CONNEXION -->
        <div class="pop-up hidden" id="connexionPopup">
            <p>Veuillez entrez votre pseudo :</p>
            <input type="text" id="usernameInput" placeholder="Votre pseudo ici" maxlength="12">
            <button class="neon-btn" id="confirmUsernameBtn">Confirmer</button>
        </div>
        <!-- POP-UP TUTORIAL -->
        <div class="pop-up hidden" id="tutoPopUp">
            <p>Savez-vous comment jouer à ce jeu ?</p>
            <div class="popup-actions">
                <button class="neon-btn yes-button" id="yes-button">Oui</button>
                <button class="neon-btn no-button" id="no-button">Non</button>
            </div>
        </div>

        <!-- LEFT PANEL -->
        <aside class="panel panel-left">
            <h2>Menu</h2>
            <ul class="menu-list">
                <li><a class="neon-btn" id="new-game">Nouvelle partie</a></li>
                <li><a class="neon-btn" id="difficulty">Difficulté</a></li>
                <li><a class="neon-btn" id="change-account">Changer de compte</a></li>
            </ul>
            <div class="panel-scores">
                <h3>Meilleurs scores mondiaux :</h3>
                <ol id="globalScoresList" class="scoresList recent-scores">
                    <!-- Scores insérés dynamiquement ici -->
                </ol>
            </div>
        </aside>

        <!-- CENTER GAME -->
        <section class="game-center">
            <div class="game-score">
                <h1>Score: <span id="gameScore">0</span></h1>
            </div>
            <div class="game-frame">
                <canvas id="canvas" width="450" height="450"></canvas>
            </div>
            <div class="game-controls">
                <select id="difficultySelect" class="neon-btn">
                    <option value="easy">Facile</option>
                    <option value="normal" selected>Normal</option>
                    <option value="hard">Difficile</option>
                </select>
            
                <button id="startBtn" class="neon-btn">Jouer</button>
            </div>

        </section>

        <!-- RIGHT PANEL -->
        <aside class="panel panel-right">
            <h2>Système</h2>

            <div class="panel-section">
                <p>Mode : <span>Arcade</span></p>
                <p>État : <span class="status-online">Online</span></p>
            </div>

            <div class="panel-section">
                <h3>Meilleurs scores</h3>
                <ol class="scoresList best-scores" id="playerScoresList">
                    <!-- Scores insérés dynamiquement ici -->
                </ol>
            </div>
        </aside>

    </main>

    <!-- FOOTER (optionnel) -->
    <footer class="hud-footer">
        <p>© 2099 - Snake Protocol</p>
    </footer>

</body>

</html>
