<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>arrow Keys</title>
</head>
<body>
    <style>
        .keys-container{
            display: grid;
            grid-template-columns: repeat(3, 50px);
            grid-template-rows: repeat(2, 50px);
            gap: 10px;
            justify-content: center;
        }
        .key{
            width: 100%;
            height: 100%;
            border: 2px solid #000;
            border-radius: 8px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 24px;
            font-weight: bold;
            user-select: none;
        }
        .arrow-up{
            grid-column: 2 / 3;
            grid-row: 1 / 2;
        }
        .arrow-down{
            grid-column: 2 / 3;
            grid-row: 2 / 3;
        }
        .arrow-left{
            grid-column: 1 / 2;
            grid-row: 2 / 3;
        }
        .arrow-right{
            grid-column: 3 / 4;
            grid-row: 2 / 3;
        }
    </style>
    <div class="keys-container">
        <div class="key arrow-up">↑</div>
        <div class="key arrow-down">↓</div>
        <div class="key arrow-left">←</div>
        <div class="key arrow-right">→</div>
    </div>
    <script>
    const keys = {
        ArrowUp: document.querySelector('.arrow-up'),
        ArrowDown: document.querySelector('.arrow-down'),
        ArrowLeft: document.querySelector('.arrow-left'),
        ArrowRight: document.querySelector('.arrow-right')
    };

    const pressed = {
        ArrowUp: false,
        ArrowDown: false,
        ArrowLeft: false,
        ArrowRight: false
    };

    document.addEventListener('keydown', (event) => {
        if (!keys[event.key]) return;

        // Effet visuel
        const key = keys[event.key];
        key.style.backgroundColor = "#39ff14";
        key.style.boxShadow = "0 0 10px #39ff14";

        // Marquer comme pressée
        pressed[event.key] = true;

        // Vérifier si toutes les touches ont été pressées
        const allPressed = Object.values(pressed).every(v => v);

        if (allPressed) {
            console.log("All arrow keys have been pressed");
        }
    });
</script>
</body>
</html>
